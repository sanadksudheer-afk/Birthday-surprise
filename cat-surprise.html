<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Last Surprise 💕</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 18px;
  text-align: center;
  font-family: Georgia, serif;
  color: #ad1457;
  background: linear-gradient(145deg, #ffe0ed, #fff5f8, #ffc8df);
}

h1 {
  font-size: 27px;
  line-height: 1.5;
}

.cat {
  display: block;
  font-size: 120px;
  margin: 0 auto;
  animation: laugh 0.5s ease-in-out infinite alternate;
}

p {
  font-size: 18px;
  line-height: 1.6;
}

.photo-frame {
  max-width: 400px;
  margin: 24px auto;
  padding: 12px;
  background: white;
  border: 3px solid #f3a1c5;
  border-radius: 18px;
  box-shadow: 0 8px 25px #c45b8730;
}

.photo-frame img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 10px;
}

@keyframes laugh {
  from { transform: rotate(-8deg) scale(1); }
  to { transform: rotate(8deg) scale(1.08); }
}

.footer {
  margin-top: 25px;
  font-size: 16px;
}

</style>
</head>

<body>

<h1>Your naughty cat has a message... 😂💕</h1>

<div class="cat">😹</div>

<p>
  HAHAHA! 😂😂<br>
  Happy birthday, nunnukutty! 💗<br>
  I love youuu! 🫂💋
</p>

<div class="photo-frame">
  <img src="cat-surprise-photo.jpg.jpg"
       alt="Our special memory">
</div>

<div class="footer">
  Made with love by your  ponnuhh 💌❤️
</div>
<div style="
    text-align: center;
    margin-top: 30px;
    margin-bottom: 25px;
    padding: 20px;
">
    <h2 style="
        color: #e91e63;
        font-size: 26px;
        animation: heartbeat 1.2s infinite;
    ">
        mmmwwuuaaahhh 💋💋💋💋
    </h2>

    <h2 style="
        color: #ff1493;
        font-size: 24px;
        margin-top: 20px;
        line-height: 1.6;
    ">
        HAPPY KUNJUMANNI 😭💗
        <br>
        APPO BIE BIEE 👅!! 💋💕
    </h2>

    <p style="font-size: 30px; margin-top: 15px;">
        🫂💗🐱🌷💋
    </p>
</div>

<style>
@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.12);
    }
}
</style>
</body>
</html>
