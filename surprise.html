<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Special Surprise ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffdae8, #ffc1d6, #fff0f5);
        color: #b01755;
        padding: 20px;
        box-sizing: border-box;
    }

    .card {
        max-width: 400px;
        background: white;
        padding: 30px 22px;
        border-radius: 25px;
        box-shadow: 0 8px 30px #e99ab8;
    }

    h1 {
        font-size: 30px;
    }

    p {
        font-size: 18px;
        line-height: 1.8;
    }

    .heart {
        font-size: 65px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        50% {
            transform: scale(1.15);
        }
    }
</style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>One Last Surprise! 🎁</h1>

    <p>
        Happy Birthday, my special person! 🎂💗
        <br><br>
        Out of all the beautiful moments in this world,
        I'm grateful for the memories we've shared.
        <br><br>
        May your birthday be filled with happiness,
        beautiful smiles, and dreams coming true. 🥹❤️
    </p>

    <p><b>Always wishing you the very best. 💖</b></p>

</div>

</body>
  </html>
